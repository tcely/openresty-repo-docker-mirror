name: Weekly Release

on:
  schedule:
    - cron: "3 18 * * 2"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-key:
    runs-on: ubuntu-slim
    outputs:
      gpg-private-key: ${{ steps.keygen.outputs.private_key }}
      release-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Set weekly release tag
        id: meta
        shell: 'bash'
        run: echo "tag=v$(date -u +%Y.0%m.%d)" >> "${GITHUB_OUTPUT}"

      - name: Generate ephemeral Ed25519 GPG keypair
        id: keygen
        shell: 'bash'
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf "${GNUPGHOME}"' EXIT

          # Expiration set to '0' (never expires) so archived releases remain valid in the future
          gpg --batch --passphrase '' \
            --quick-generate-key "OpenResty Snapshot (${{ steps.meta.outputs.tag }}) <admin@openresty.com>" \
            ed25519 sign 0

          mkdir -p dist
          gpg --batch --armor -o dist/openresty-repo.asc --export

          KEY_ARMOR="$(gpg --batch --armor --export-secret-keys)"
          {
            echo "private_key<<EOF_GPG_KEY"
            echo "${KEY_ARMOR}"
            echo "EOF_GPG_KEY"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload public key artifact
        uses: actions/upload-artifact@v4
        with:
          name: openresty-repo-pubkey
          path: dist/openresty-repo.asc
          if-no-files-found: error
          retention-days: 10

  build:
    needs: prepare-key
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
    with:
      output: image
      push: false
      export-image: true
      platforms: linux/amd64,linux/arm64
      meta-images: openresty-trixie-repo
      meta-tags: |
        type=raw,value=${{ needs.prepare-key.outputs.release-tag }}
    secrets:
      secrets: |
        apt_signing_key=${{ needs.prepare-key.outputs.gpg-private-key }}

  publish-release:
    needs: [prepare-key, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download public key artifact
        uses: actions/download-artifact@v4
        with:
          name: openresty-repo-pubkey
          path: release-assets

      - name: Download exported Docker image artifact
        uses: actions/download-artifact@v4
        with:
          pattern: '*image*'
          merge-multiple: true
          path: release-assets

      - name: Compress Docker image tar with multi-threaded zstd
        shell: 'bash'
        run: |
          set -euo pipefail
          shopt -s nullglob
          for tarfile in release-assets/*.tar; do
            zstd -T0 -19 --rm "${tarfile}"
          done
          ls -lh release-assets/

      - name: Create GitHub Release with zstd image tar and .asc key
        shell: 'bash'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ needs.prepare-key.outputs.release-tag }}" \
            release-assets/* \
            --title 'OpenResty Trixie Snapshot (${{ needs.prepare-key.outputs.release-tag }})' \
            --notes 'Self-contained OpenResty APT repository Docker image for Debian Trixie (`amd64` & `arm64`) compressed with `zstd`, alongside its ephemeral public signing key (`openresty-repo.asc`).'
